[gcode_shell_command nozzlevision]
command: /home/pi/NozzleVision/run.sh
timeout: 30.
verbose: True


[gcode_macro NOZZLE_CHECK]
gcode:
    RESPOND MSG="NozzleVision: starting..."
    RUN_SHELL_COMMAND CMD=nozzlevision
    RESPOND MSG="NozzleVision: finished."


[gcode_macro NOZZLE_INSPECT]
gcode:
    {% set cfg = printer["configfile"].config["nozzlevision"] %}

    SAVE_GCODE_STATE NAME=NOZZLE_INSPECT

    G90
    G1 X{cfg.camera_x} Y{cfg.camera_y} Z{cfg.camera_z} F12000
    M400
    G4 P500

    NOZZLE_CHECK

    RESTORE_GCODE_STATE NAME=NOZZLE_INSPECT


[gcode_macro NOZZLE_AUTO]
variable_blob: 0
variable_attempt: 0
gcode:
    {% set cfg = printer["configfile"].config["nozzlevision"] %}

    SET_GCODE_VARIABLE MACRO=NOZZLE_AUTO VARIABLE=attempt VALUE=1

    G90
    G1 X{cfg.camera_x} Y{cfg.camera_y} Z{cfg.camera_z} F12000
    M400
    G4 P500

    # Set LEDs to white while inspecting
    SET_LED LED="sb_leds" RED=1 GREEN=1 BLUE=1 SYNC=0 TRANSMIT=1

    RUN_SHELL_COMMAND CMD=nozzlevision

    UPDATE_DELAYED_GCODE ID=NOZZLE_DECIDE DURATION=1.0


[delayed_gcode NOZZLE_DECIDE]
gcode:
    {% set cfg = printer["configfile"].config["nozzlevision"] %}

    {% if printer["gcode_macro NOZZLE_AUTO"].blob|int == 0 %}

        RESPOND MSG="Nozzle clean."

    {% elif printer["gcode_macro NOZZLE_AUTO"].attempt|int < cfg.max_attempts|int %}

        RESPOND MSG="Blob detected. Brushing..."

        AFC_BRUSH

        SET_GCODE_VARIABLE MACRO=NOZZLE_AUTO VARIABLE=attempt VALUE={printer["gcode_macro NOZZLE_AUTO"].attempt + 1}

        G90
        G1 X{cfg.camera_x} Y{cfg.camera_y} Z{cfg.camera_z} F12000
        M400
        G4 P500

        RUN_SHELL_COMMAND CMD=nozzlevision

        UPDATE_DELAYED_GCODE ID=NOZZLE_DECIDE DURATION=1.0

    {% else %}

        RESPOND TYPE=error MSG="NozzleVision: Blob still detected after {cfg.max_attempts} attempts."

        PAUSE

    {% endif %}


[nozzlevision]

# Inspection position
camera_x: 68
camera_y: 343
camera_z: 18

# Camera
camera_url: http://127.0.0.1/webcam/?action=snapshot

# Image processing
roi_x: 560
roi_y: 120
roi_width: 180
roi_height: 140

threshold: 45
min_blob_area: 120
max_blob_area: 5000

# Behaviour
brush_macro: AFC_BRUSH
max_attempts: 3